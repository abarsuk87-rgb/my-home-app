<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій дім</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --accent: #1a73e8; --text: #ffffff; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 24px; }
        .mic-btn { width: 60px; height: 60px; border-radius: 50%; background: var(--accent); border: none; color: white; font-size: 24px; cursor: pointer; }
        .mic-btn.active { background: #ea4335; animation: pulse 1s infinite; }
        .section-title { font-size: 18px; margin: 20px 0 10px 0; color: #888; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .card { background: var(--card); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; height: 90px; }
        .card h3 { margin: 0; font-size: 15px; }
        .card p { margin: 4px 0; font-size: 12px; color: #aaa; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <header>
        <h1>Мій дім</h1>
        <button class="mic-btn" id="micBtn">🎙️</button>
    </header>

    <div id="status" style="color: #888; font-size: 14px; margin-bottom: 15px;">Натисніть мікрофон</div>

    <div class="section-title">Сценарії</div>
    <div class="grid" id="scenariosGrid"></div>

    <div id="roomsContainer"></div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const status = document.getElementById('status');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const rec = new SpeechRecognition();
            rec.lang = 'uk-UA';

            micBtn.onclick = () => rec.start();
            rec.onstart = () => { micBtn.classList.add('active'); status.innerText = "Слухаю..."; };
            rec.onend = () => { micBtn.classList.remove('active'); };
            rec.onresult = async (e) => {
                const text = e.results[0][0].transcript;
                status.innerText = `Ви сказав: "${text}"`;
                const res = await fetch('/api/voice', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                status.innerText = data.response;
                
                const utt = new SpeechSynthesisUtterance(data.response);
                utt.lang = 'uk-UA';
                window.speechSynthesis.speak(utt);
                loadDevices();
            };
        }

        async function loadDevices() {
            const res = await fetch('/api/devices');
            const devices = await res.json();
            const rooms = {};
            for (let id in devices) {
                const d = devices[id];
                if (!rooms[d.room]) rooms[d.room] = [];
                rooms[d.room].push({...d, id});
            }
            const container = document.getElementById('roomsContainer');
            container.innerHTML = '';
            for (let room in rooms) {
                let html = `<div class="section-title">${room}</div><div class="grid">`;
                rooms[room].forEach(d => {
                    html += `<div class="card"><div><h3>${d.name}</h3><p>${d.type}</p></div></div>`;
                });
                html += `</div>`;
                container.innerHTML += html;
            }
        }

        async function loadScenarios() {
            const res = await fetch('/api/scenarios');
            const scenarios = await res.json();
            const grid = document.getElementById('scenariosGrid');
            grid.innerHTML = '';
            scenarios.forEach(s => {
                grid.innerHTML += `<div class="card" style="cursor:pointer;" onclick="runScenario('${s}')"><h3>🎬 ${s.toUpperCase()}</h3></div>`;
            });
        }

        async function runScenario(name) {
            await fetch('/api/voice', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ text: `Запусти сценарій ${name}` })
            });
            loadDevices();
        }

        loadDevices();
        loadScenarios();
    </script>
</body>
</html>
